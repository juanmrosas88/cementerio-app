# ============================================================
# Deploy automático a GitHub Pages
# Publica SOLO los archivos de la app en un directorio limpio,
# excluyendo archivos internos (.freebuff/, NUL, etc.).
#
# Se dispara en cada push a main, o manualmente desde la
# pestaña "Actions" (botón "Run workflow").
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues concurrentes sobre la misma página
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar directorio de publicación (solo archivos de la app)
        run: |
          mkdir -p _site
          cp index.html app.js data.js styles.css logoheader.svg _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
